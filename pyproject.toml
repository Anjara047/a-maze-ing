[project]
name = "mazegen"
version = "0.1.0"
description = "Reusable Maze Generator for 42 project"
requires-python = ">=3.10"
dependencies = [
    "mypy (>=2.3.0,<3.0.0)",
    "flake8 (>=7.3.0,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "mazegen" }]